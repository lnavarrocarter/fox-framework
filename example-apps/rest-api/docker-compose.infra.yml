version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fox
      POSTGRES_PASSWORD: fox
      POSTGRES_DB: todos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fox"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
