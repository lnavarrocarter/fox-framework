[package]
name = "fox-framework"
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.100"
description = "An HTTP framework with a Fox-owned router and middleware pipeline"
license = "MIT"
repository = "https://github.com/lnavarrocarter/fox-framework"
readme = "README.md"
default-run = "fox"
include = ["src/**", "tests/**", "examples/hello.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "fox"
path = "src/bin/fox.rs"
