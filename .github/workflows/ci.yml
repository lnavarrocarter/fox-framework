name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests and generated project validation
        run: cargo test --all-targets --locked
      - name: Documentation examples
        run: cargo test --doc --locked
      - name: Verify distributable crate
        run: cargo package --locked
      - name: Build example container
        run: docker build --tag fox-example:ci .
